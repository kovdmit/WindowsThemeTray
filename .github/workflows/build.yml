name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o WindowsThemeTray.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsThemeTray
          path: WindowsThemeTray.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WindowsThemeTray.exe
